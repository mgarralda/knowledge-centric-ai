$schema: https://json-schema.org/draft/2020-12/schema
title: Governance Decision
type: object
required:
  - document_type
  - format_version
  - specification_version
  - id
  - artifact_status
  - normative
  - schema_ref
  - status
  - generated_from
  - inputs
  - review
  - dispositions
  - impact_record
  - activation
  - historical_immutability
  - capability_formation
  - resulting_lineage_edges
properties:
  document_type: {const: governance-decision}
  format_version: {const: icla-artifact/0.1-draft}
  specification_version:
    type: object
    required: [icla-spec]
    properties:
      icla-spec: {const: 0.1.0}
    additionalProperties: false
  id: {type: string, pattern: "^DEC-[A-Z0-9-]+$"}
  artifact_status: {const: reference}
  normative: {const: false}
  schema_ref: {type: string}
  status: {enum: [approved, rejected, deferred, quarantined, superseded]}
  generated_from: {type: object, minProperties: 3}
  inputs:
    type: object
    required: [evidence_ref, qualification_receipt_ref, assembly_ref, registry_snapshot_ref]
    additionalProperties: true
  review: {type: object}
  dispositions:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      properties:
        candidate_ref: {type: string, pattern: "^CAND-[A-Z0-9-]+$"}
        memory_transition: {$ref: "#/$defs/memory_transition"}
        candidate_lifecycle_transition:
          type: object
          required: [from, to]
          properties:
            from: {const: submitted}
            to: {enum: [admitted, rejected, quarantined, retained-local]}
          additionalProperties: false
      dependentRequired:
        candidate_ref: [memory_transition, candidate_lifecycle_transition]
      additionalProperties: true
  impact_record:
    type: object
    required: [id, affected_capabilities, affected_ckcs, review_required]
    properties:
      change_event_ref: {type: string, minLength: 1}
      assessment_mode: {enum: [event-driven, continuous-event-driven]}
    additionalProperties: true
  activation:
    type: object
    required: [id, capability, ckc, version, applies_to, active_pointer_transition, rollback_target]
    additionalProperties: true
  historical_immutability:
    type: object
    required: [assembly_ref, remains_linked_to, retroactive_mutation]
    additionalProperties: true
  capability_formation:
    type: object
    required: [new_capability_created_by_this_decision, rationale]
    properties:
      proposals:
        type: array
        uniqueItems: true
        items:
          type: object
          required:
            - id
            - status
            - recurrent_pattern_refs
            - stable_assembly_rules
            - value_assessment
            - comparable_outcome_refs
            - candidate_owner
            - overlap_analysis
            - draft_ckc_ref
          properties:
            id: {type: string, pattern: "^PROP-[A-Z0-9-]+$"}
            status: {enum: [proposed, under-review, approved, rejected, promoted]}
            recurrent_pattern_refs: {type: array, minItems: 1}
            stable_assembly_rules: {type: array, minItems: 1}
            value_assessment: {type: object, minProperties: 1}
            comparable_outcome_refs: {type: array, minItems: 1}
            candidate_owner: {type: string, minLength: 1}
            overlap_analysis: {type: array, minItems: 1}
            draft_ckc_ref: {type: string, minLength: 1}
          additionalProperties: true
    additionalProperties: true
  resulting_lineage_edges:
    type: array
    minItems: 1
    items:
      type: object
      required: [type, from, to]
      additionalProperties: true
$defs:
  memory_transition:
    type: object
    required: [from, to, mechanism]
    properties:
      from: {enum: [semantic, procedural, episodic]}
      to: {enum: [semantic, procedural, episodic]}
      mechanism: {enum: [successor-ckc, source-binding-refresh, retain-as-precedent]}
    additionalProperties: false
additionalProperties: true
